function persist(retry=false){
 clearTimeout(saveTimer);if(!dirty)return true;if(saveBlock){paintSave();return false;}
 try{
  const current=localStorage.getItem(STORAGE_KEY);if(current!==lastRaw){saveBlock='conflict';paintNotices();paintSave();return false;}
  const next={...state,revision:state.revision+1,writerId:tabId,updatedAt:now()};const raw=JSON.stringify(next);
  localStorage.setItem(STORAGE_KEY,raw);
  if(localStorage.getItem(STORAGE_KEY)!==raw)throw Error('保存後の照合に失敗しました');
  const prior=lastRaw;lastRaw=raw;state.revision=next.revision;state.writerId=tabId;state.updatedAt=next.updatedAt;lastSaveAt=next.updatedAt;dirty=false;saveError='';
  if(prior&&Date.now()-lastPrevTime>60000){try{localStorage.setItem(PREV_KEY,prior);lastPrevTime=Date.now();}catch(e){console.warn('Previous snapshot unavailable:',e.message);}}

 }catch(e){saveError='保存に失敗しました。容量不足・ブラウザ制限などが考えられます。画面を閉じる前にバックアップしてください。';console.warn('Storage save:',e.message);paintSave();paintNotices();if(!retry){clearTimeout(retryTimer);retryTimer=setTimeout(()=>persist(true),1600);}return false;}

// Deliberately limited, deterministic checks; never pretend to interpret prose.
function localChecks(p=project()){
 const out=[];const add=(title,evidence,kind='登録の確認',targetId='')=>{const id='rule-'+hash(title+'\n'+evidence);out.push({id,title,evidence,kind,targetId,origin:'rule',state:p.ruleReviews[id]?.state||'open',notes:p.ruleReviews[id]?.note||''});};
 const chMap=new Map(p.chapters.map(c=>[c.id,c]));
 const groups=new Map();for(const c of p.chapters){const prev=groups.get(c.number);if(prev)add(`第${c.number}話が重複しています`,`「${prev.title||'無題'}」と「${c.title||'無題'}」が同じ話数です。別案なら話数・扱いを整理してください。`,'話数',c.id);else groups.set(c.number,c);}
 const fs=p.facts.filter(f=>f.canon==='confirmed'),factGroups=new Map();
 for(const f of fs){
  const key=norm(f.name)+'\0'+norm(f.attribute);if(!factGroups.has(key))factGroups.set(key,[]);factGroups.get(key).push(f);
  if(f.sourceChapterId){const c=chMap.get(f.sourceChapterId);if(!c)add('設定の参照先がありません',`「${f.name} / ${f.attribute}」の出典が削除されている可能性があります。設定を編集し、出典を確認してください。`,'出典');else if(c.status==='draft')add('確定設定の出典が下書きです',`「${f.name} / ${f.attribute}」は確定ですが、出典の第${c.number}話「${c.title||'無題'}」は未採用です。作者設定なのか、本文の採用待ちなのか確認してください。`,'出典',c.id);
   if(c&&f.sourceQuote&&!c.text.includes(f.sourceQuote))add('登録した引用が本文に見つかりません',`設定「${f.name} / ${f.attribute}」の引用：\n「${f.sourceQuote}」\n出典：第${c.number}話「${c.title||'無題'}」。完全一致で比較しています。表記変更の可能性もあります。`,'引用',c.id);
  }
  for(const w of f.watchWords.split(/[,、\n]/).map(s=>s.trim()).filter(Boolean)){
   for(const c of p.chapters){if(c.number<Number(f.from||1)||c.number>Number(f.to||Infinity))continue;const index=c.text.indexOf(w);if(index<0)continue;const snippet=c.text.slice(Math.max(0,index-42),Math.min(c.text.length,index+w.length+68));add(`注意語「${w}」を検出`,`第${c.number}話「${c.title||'無題'}」：\n「${snippet}」\n参照設定：${f.name} / ${f.attribute} = ${f.value}\n文字列の検出のみです。否定文・他人の発言・別人の能力などは矛盾とは限りません。`,'注意語',c.id);}
  }
 }
 for(const list of factGroups.values())for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++){const a=list[i],b=list[j];if(norm(a.value)===norm(b.value))continue;if(Math.max(Number(a.from||1),Number(b.from||1))<=Math.min(Number(a.to||Infinity),Number(b.to||Infinity)))add('同じ項目に異なる確定設定があります',`${a.name} / ${a.attribute}\nA：${a.value}（第${a.from||1}話〜${a.to||'以後'}）\nB：${b.value}（第${b.from||1}話〜${b.to||'以後'}）\n適用範囲が重なっています。両立する補足・言い換えの場合もあるため、意味は作者が確認してください。`,'設定の重複');}
 const minutes=t=>{if(!/^\d{2}:\d{2}$/.test(t))return null;const[h,m]=t.split(':').map(Number);return h<24&&m<60?h*60+m:null;};
 const eventGroups=new Map();for(const e of p.events.filter(e=>e.canon==='confirmed')){if(e.chapterId&&!chMap.has(e.chapterId))add('出来事の参照先がありません',`「${e.title}」の該当話が見つかりません。`,'出典');if(!e.actor||e.day===''||!Number.isFinite(Number(e.day)))continue;const st=minutes(e.start),en=minutes(e.end);if(st===null)continue;if(en!==null&&en<st){add('出来事の終了時刻が開始より前です',`${e.title}：${e.day}日目 ${e.start}〜${e.end}。日をまたぐ場合は2件に分けてください。`,'時刻');continue;}const k=norm(e.actor)+'\0'+Number(e.day);if(!eventGroups.has(k))eventGroups.set(k,[]);eventGroups.get(k).push({e,start:st,end:en});}
 for(const list of eventGroups.values())for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++){const a=list[i],b=list[j];if(!a.e.place||!b.e.place||norm(a.e.place)===norm(b.e.place))continue;const aRange=a.end!==null&&a.end>a.start,bRange=b.end!==null&&b.end>b.start;const overlap=aRange&&bRange?a.start<b.end&&b.start<a.end:aRange?b.start>=a.start&&b.start<a.end:bRange?a.start>=b.start&&a.start<b.end:a.start===b.start;if(overlap)add('同じ人物の時間と場所が重なっています',`${a.e.actor} / ${a.e.day}日目\n「${a.e.title}」${a.e.start}${a.e.end?'〜'+a.e.end:''} / ${a.e.place}\n「${b.e.title}」${b.e.start}${b.e.end?'〜'+b.e.end:''} / ${b.e.place}\n別名の場所・瞬間移動などの設定があるか確認してください。移動速度や距離は計算していません。`,'時系列',a.e.chapterId);}
 for(const h of p.hooks){const planted=chMap.get(h.plantedId),payoff=chMap.get(h.payoffId);if(h.plantedId&&!planted||h.payoffId&&!payoff)add('伏線の参照先がありません',`「${h.title}」の設置話または回収話が見つかりません。`,'伏線');if(h.state==='resolved'&&!h.payoffId)add('回収済みの伏線に回収先がありません',`「${h.title}」を回収した話を登録してください。`,'伏線');if(planted&&payoff&&payoff.number<planted.number)add('伏線の回収先が設置話より前です',`「${h.title}」：設置は第${planted.number}話、回収先は第${payoff.number}話。回想・逆順構成なら意図を記録してください。`,'伏線',payoff.id);if(h.state==='resolved'&&payoff?.status==='draft')add('回収済みの伏線の本文が未採用です',`「${h.title}」の回収先は第${payoff.number}話の下書きです。本文を採用するか、状態を「回収予定」に戻してください。`,'伏線',payoff.id);}
 return out;
}
function renderChecks(){

 const shownRules=rs.filter(r=>issueFilter==='all'||r.state===issueFilter),shownManual=p.issues.filter(i=>issueFilter==='all'||i.state===issueFilter);

function autoFactsText(p){const fc=p.facts.filter(f=>f.canon==='confirmed');return fc.length?fc.map(f=>`${f.category} / ${f.name} / ${f.attribute}: ${f.value}${f.immutable?' [変更禁止]':''}${f.notes?' / '+f.notes:''}`).join('\n'):'確定設定は未登録';}
function autoEventsText(p){const ev=p.events.filter(e=>e.canon==='confirmed');return ev.length?ev.map(e=>`${e.day!==''?e.day+'日目':'日付未定'} ${e.start}${e.end?'〜'+e.end:''} / ${e.actor||'人物未設定'} / ${e.place||'場所未設定'} / ${e.title}: ${e.description}`).join('\n'):'確定時系列は未登録';}
function autoHooksText(p){return p.hooks.length?p.hooks.map(h=>`${h.state} / ${h.title}: ${h.description}${h.notes?' / '+h.notes:''}`).join('\n'):'伏線は未登録';}
function autoContext(p,nextNumber){const prior=chaptersSorted().filter(c=>c.number<nextNumber&&c.text.trim());const summaries=prior.map(c=>`第${c.number}話「${c.title||'無題'}」: ${c.summary||'(要約未登録)'}`);const recent=prior.slice(-3).map(c=>`第${c.number}話「${c.title||'無題'}」\n${c.text}`);return{project:{title:p.title,genre:p.genre,brief:p.brief,voice:p.voice,invariants:p.invariants,notes:p.notes},plan:p.auto.plan,provisionalLedger:p.auto.ledger,confirmedFacts:autoFactsText(p),confirmedTimeline:autoEventsText(p),hooks:autoHooksText(p),summaries,recentChapters:recent};}
function nextAutoNumber(p){const nums=p.chapters.map(c=>c.number);return Math.max(0,...nums)+1;}
function addAutoLog(msg){const a=project().auto;a.log=`[${new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}] ${msg}\n`+a.log;a.log=a.log.slice(0,900000);markDirty();if(view==='auto')render();}
function usageCostEstimate(usage,writerModel,checkerModel){if(!usage)return 0;return Number(usage.estimated_cost_usd||0)||0;}
async function callStoryWorker(path,payload){const a=project().auto;let base=a.endpoint.trim().replace(/\/+$/,'');if(!base)throw Error('API Worker URLを設定してください。');const r=await fetch(base+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});let data;try{data=await r.json();}catch(e){throw Error('APIからJSONではない応答が返りました。');}if(!r.ok)throw Error(data?.error||`APIエラー (${r.status})`);return data;}
function appendLedger(delta,chapterNumber){if(!delta)return;const groups=[];for(const [k,v] of Object.entries(delta)){if(Array.isArray(v)&&v.length)groups.push(`${k}:\n- ${v.join('\n- ')}`);}if(groups.length)project().auto.ledger+=`${project().auto.ledger?'\n\n':''}【第${chapterNumber}話で追加された仮台帳】\n${groups.join('\n')}`;}
function recordAutoIssues(check,c){if(!check?.issues?.length)return;const p=project();for(const x of check.issues){p.issues.push({id:uid(),kind:x.severity==='major'?'矛盾候補':'未確認',title:`第${c.number}話 AI確認: ${x.category}`,chapterId:c.id,evidence:`${x.description}\n根拠: ${x.evidence}`,proposal:x.repair||'',notes:'APIによる自動確認。作者確認前。',state:'open',createdAt:now()});}}
async function autoGenerateOne(silent=false){const p=project(),a=p.auto;if(a.running&&!silent)return;const next=nextAutoNumber(p);if(next>a.targetTotal){if(!silent)toast(`目標の第${a.targetTotal}話まであります。`);return{done:true};}a.running=true;a.stopRequested=false;if(view==='auto')render();addAutoLog(`第${next}話の生成を開始`);try{const payload={targetNumber:next,wordCount:a.wordCount,writerModel:a.writerModel,checkerModel:a.checkerModel,context:autoContext(p,next)};const data=await callStoryWorker('/api/generate-chapter',payload);const d=data.draft;if(!d?.text)throw Error('本文が返ってきませんでした。');const c=newChapter(next);c.title=d.title||`第${next}話`;c.text=d.text;c.summary=d.summary||'';c.intent=`API自動生成。独立チェック: ${data.check?.severity||'未確認'}。作者確認前。`;c.status='draft';p.chapters.push(c);appendLedger(data.check?.ledger_delta,next);recordAutoIssues(data.check,c);a.lastUsage=data.usage||null;a.estimatedCostUsd+=usageCostEstimate(data.usage,a.writerModel,a.checkerModel);a.lastRunAt=now();saveNow();addAutoLog(`第${next}話を下書き保存 / チェック: ${data.check?.severity||'不明'}${data.revised?' / 自動修正済み':''}`);if(data.check?.severity==='major'){addAutoLog('重大な矛盾候補が残ったため連続生成を停止');a.stopRequested=true;saveNow();if(!silent)toast('重大な矛盾候補が残りました。チェック記録を確認してください。');return{blocked:true,chapter:c};}if(next%10===0){const audit=await autoAudit(true);if(audit?.blocked)return{blocked:true,chapter:c};}if(!silent)toast(`第${next}話を下書きとして生成しました。`);return{chapter:c};}catch(e){addAutoLog('エラー: '+e.message);if(!silent)toast(e.message);throw e;}finally{a.running=false;saveNow();if(view==='auto')render();}}
async function autoRunToTarget(){const a=project().auto;if(a.running)return;const start=nextAutoNumber(project());if(!ask(`第${start}話から最大第${a.targetTotal}話まで連続生成します。\nAPI料金が発生します。重大な矛盾候補・APIエラー・停止操作で止まります。\n\nブラウザを閉じずに実行します。開始しますか？`))return;a.running=true;a.stopRequested=false;render();addAutoLog(`連続生成を開始（目標 第${a.targetTotal}話）`);try{while(nextAutoNumber(project())<=a.targetTotal&&!a.stopRequested){a.running=false;const r=await autoGenerateOne(true);a.running=true;if(r?.blocked||r?.done)break;await new Promise(r=>setTimeout(r,250));}addAutoLog(a.stopRequested?'連続生成を停止':'連続生成が終了');}catch(e){addAutoLog('連続生成を中断: '+e.message);}finally{a.running=false;saveNow();render();}}

function splitPrompt(text,limit=10000){const parts=[];let rest=text;while(rest.length>limit){let cut=rest.lastIndexOf('\n',limit);if(cut<limit*.6)cut=limit;if(/[\uD800-\uDBFF]/.test(rest[cut-1]))cut--;parts.push(rest.slice(0,cut));rest=rest.slice(cut);}if(rest)parts.push(rest);return parts;}
function packetText(text,index){const chunks=splitPrompt(text);if(chunks.length===1)return text;return`【参照資料 分割 ${index+1}/${chunks.length}】\nこの分割送信の全${chunks.length}件がそろうまでは、作業を開始せず受領した番号だけを返してください。この送信は一つの新しい依頼です。\n\n${chunks[index]}\n\n${index===chunks.length-1?`【最終分割 ${chunks.length}/${chunks.length}】すべて受領できた場合のみ、全体を一つの依頼として作業してください。受領できていない番号・読み切れない範囲は明示してください。`:`【分割 ${index+1} 終了】続きがあります。まだ作業しないでください。`}`;}
function paintPrompt(){if(view!=='assistant'||!$('#prompt-output'))return;const a=project().assistant;const stale=!!a.output&&a.signature!==sourceSignature();$('#prompt-output').value=a.output;$('#prompt-info').innerHTML=a.output?`<div class="row between small muted" style="margin-bottom:10px"><span>${fmt(Array.from(a.output).length)}文字 · ${dateText(a.builtAt)}</span>${badge(stale?'更新が必要':'依頼文を作成済み',stale?'orange':'green')}</div>${stale?'<div class="notice warn" style="margin-bottom:12px">設定・原稿・依頼条件が変わりました。コピーする前に、依頼文を組み立て直してください。</div>':''}`:'<p class="small muted">まだ依頼文を作っていません。</p>';const chunks=splitPrompt(a.output);$('#packet-controls').innerHTML=chunks.length>1?`<div class="notice"><div class="row between"><span>長文用：${chunks.length}分割（各約1万文字）</span><div class="row"><select id="packet-index" aria-label="コピーする分割番号" style="width:auto;padding:6px;font-size:12px">${chunks.map((_,i)=>`<option value="${i}" ${packetIndex===i?'selected':''}>${i+1} / ${chunks.length}</option>`).join('')}</select>${btn('この分割をコピー','copy-packet','tiny')}</div></div>1番から順に貼り付けてください。内容は省略していません。</div>`:'';}

async function readJSON(file){if(!file)return;try{if(file.size>15000000)throw Error('ファイルが15MBを超えています。');const parsed=cleanState(await file.text());previewImport(parsed,file.name);}catch(e){toast('読み込めませんでした。元データは変更していません。\n'+e.message);}}
async function readTexts(files){if(!files.length)return;try{const list=[];for(const file of files){if(!/\.(txt|md)$/i.test(file.name))throw Error('txt または md ファイルを選んでください。');if(file.size>2000000)throw Error(file.name+'が2MBを超えています。');const data=new TextDecoder('utf-8',{fatal:true}).decode(await file.arrayBuffer());list.push({name:file.name.replace(/\.(txt|md)$/i,''),text:data.replace(/^\uFEFF/,'')});}const p=project();let n=Math.max(0,...p.chapters.map(c=>c.number));for(const item of list){const c=newChapter(++n);c.title=item.name;c.text=item.text;p.chapters.push(c);chapterId=c.id;}saveNow();go('desk');toast(`${list.length}ファイルを下書きに追加しました。`);}catch(e){toast('原稿を読み込めませんでした。\nUTF-8のテキストをご確認ください。\n'+e.message);}}

 'focus':()=>document.body.classList.toggle('focus-mode'),
 'history':showHistory,
 'preview-history':el=>{const h=chapter(chapterId)?.history.find(h=>h.id===el.dataset.id);if(!h)return;showModal('履歴の内容',`<h3>${esc(h.title||'無題')}</h3><p class="small muted">${dateText(h.at)} / 第${h.number}話</p><div class="doc-preview">${esc(h.text)}</div><div class="modal-footer">${btn('履歴一覧へ','history')}${btn('閉じる','close-modal')}</div>`);},
 'restore-history':el=>{const c=chapter(chapterId),h=c?.history.find(h=>h.id===el.dataset.id);if(!c||!h||c.status==='locked')return;if(!ask('選んだ版を下書きとして復元します。今の版も履歴へ残します。'))return;const old=clone(h);snapshot(c,'履歴を復元する前');c.title=old.title;c.text=old.text;c.summary=old.summary;c.number=old.number;c.status='draft';c.updatedAt=now();closeModal();saveNow();render();toast('下書きとして復元しました。');},
 'export-chapter':()=>{const c=chapter(chapterId);if(c)downloadText(c.text,`第${c.number}話-${safeName(c.title||'無題')}.txt`);},
 'edit-fact':el=>editFact(el.dataset.id),
 'edit-event':el=>editEvent(el.dataset.id),
 'edit-hook':el=>editHook(el.dataset.id),
 'edit-issue':el=>editIssue(el.dataset.id),
 'delete-fact':el=>deleteRecord('facts',el.dataset.id,'設定'),
 'delete-event':el=>deleteRecord('events',el.dataset.id,'出来事'),
 'delete-hook':el=>deleteRecord('hooks',el.dataset.id,'伏線'),
 'delete-issue':el=>deleteRecord('issues',el.dataset.id,'確認記録'),
 'fact-category':el=>{filterCategory=el.dataset.category;render();},
 'hook-filter':el=>{hookFilter=el.dataset.value;render();},
 'issue-filter':el=>{issueFilter=el.dataset.value;render();},
 'rule-intent':el=>{const p=project(),r=localChecks().find(r=>r.id===el.dataset.id);if(!r)return;if(r.state==='intentional'){delete p.ruleReviews[r.id];saveNow();render();return;}showModal('作者の意図を記録',`<form id="rule-form" data-id="${esc(r.id)}"><p class="small">${esc(r.title)}</p><div class="notice">機械の検出を取り消すのではなく、作者の意図として記録します。検出内容が変われば別の候補として再表示されます。</div>${area('矛盾ではない理由・意図','note','',4,'例：第5話は第2話より前の出来事を描く回想。','required')}${finishForm('意図的として記録')}</form>`);},
 'ai-mode':el=>{project().assistant.mode=el.dataset.value;markDirty();render();},
 'check-chapter':el=>{const a=project().assistant;a.targetId=el.dataset.id;a.mode='check';markDirty();go('assistant');},
 'build-prompt':()=>{const p=project(),a=p.assistant;if(a.mode==='revise'&&!chapter(a.targetId))return toast('修正する原稿を選んでください。');a.wordCount=Math.max(200,Math.min(20000,Number(a.wordCount)||2000));a.output=generatePrompt();a.builtAt=now();a.signature=sourceSignature();packetIndex=0;saveNow();paintPrompt();toast('依頼文を作成しました。コピーしてChatGPTへ貼り付けてください。');},
 'copy-prompt':()=>{if(ensurePrompt())copyText(project().assistant.output);},
 'copy-packet':()=>{if(ensurePrompt())copyText(packetText(project().assistant.output,packetIndex));},
 'export-prompt':()=>{if(ensurePrompt())downloadText(project().assistant.output,safeName(project().title)+'-ChatGPTへの依頼.txt');},
 'select-manual-copy':()=>{$('#manual-copy').focus();$('#manual-copy').select();$('#manual-copy').setSelectionRange(0,$('#manual-copy').value.length);},
 'import-reply':importReply,
 'record-reply':()=>{const a=project().assistant;if(!a.reply.trim())return toast('回答を貼り付けてください。');editIssue('',{title:'ChatGPTの確認結果 '+dateText(now()),kind:'未確認',chapterId:a.targetId,evidence:a.reply,notes:'ChatGPTの回答を未確認のまま保存。根拠を本文で確かめてから対応状態を更新する。'});},
 'auto-one':()=>autoGenerateOne(false),
 'auto-run':()=>autoRunToTarget(),
 'auto-audit':()=>autoAudit(false),
 'auto-stop':()=>{project().auto.stopRequested=true;addAutoLog('停止を要求しました。現在のAPI応答が終わったところで止まります。');},
 'auto-clear-log':()=>{project().auto.log='';saveNow();render();},
 'export-json':exportJSON,
 'import-json':()=>{$('#json-file').value='';$('#json-file').click();},
 'import-text':()=>{$('#text-files').value='';$('#text-files').click();},
 'export-all-text':exportAllText,
 'load-previous':()=>{try{const raw=localStorage.getItem(PREV_KEY);if(!raw)return toast('直前のコピーはありません。');previewImport(cleanState(raw),'端末内の直前コピー');}catch(e){toast('直前のコピーを読み取れませんでした。\n'+e.message);}},
 'clear-previous':()=>{if(!ask('直前コピーの領域だけを空けます。現在の作品は削除しません。JSONを保存済みですか？'))return;try{localStorage.removeItem(PREV_KEY);lastPrevTime=Date.now();toast('直前コピー用の領域を空けました。');if(dirty)persist();render();}catch(e){toast('領域を空けられませんでした。');}},
 'append-import':()=>{if(!pendingImport||saveBlock==='corrupt')return;const added=pendingImport.projects.map(p=>{const q=clone(p);q.id=uid();if(state.projects.some(x=>x.title===q.title))q.title+='（読み込み）';return q;});state.projects.push(...added);state.activeId=added[0].id;pendingImport=null;chapterId='';closeModal();saveNow();go('desk');toast('バックアップを別作品として追加しました。');},
 'restore-import':()=>{if(!pendingImport)return;if(!ask('現在のすべての作品をバックアップの内容で置き換えます。\nこの画面の必要なデータは書き出しましたか？'))return;const next=clone(pendingImport);if(saveBlock==='corrupt'){try{localStorage.setItem(STORAGE_KEY+':unreadable-'+Date.now(),corruptRaw);}catch(e){if(!ask('読み取れなかった元データの退避にも失敗しました。元データを取り出していなければキャンセルしてください。\nそれでも復元しますか？'))return;}}try{lastRaw=localStorage.getItem(STORAGE_KEY);}catch(e){}state=next;state.writerId=tabId;saveBlock='';saveError='';corruptRaw='';pendingImport=null;chapterId='';closeModal();saveNow();go('desk');toast(dirty?'画面には復元しましたが端末への保存が未完了です。警告を確認してください。':'バックアップを復元しました。');},
 'export-corrupt':()=>{if(corruptRaw)downloadText(corruptRaw,'ものがたり工房-読み取れなかった元データ-'+fileStamp()+'.txt');},
 'retry-save':()=>{dirty=true;persist(true);},
 'reload':()=>{if(dirty&&!ask('この画面の未保存の入力は失われます。必要なバックアップを書き出してから再読み込みしてください。\n再読み込みしますか？'))return;dirty=false;location.reload();},
 'delete-project':()=>{const p=project();if(!ask(`作品「${p.title}」と、その中のすべての原稿・設定・履歴を削除します。\nバックアップからしか復元できません。本当に削除しますか？`))return;state.projects=state.projects.filter(x=>x.id!==p.id);if(!state.projects.length)state.projects.push(newProject());state.activeId=state.projects[0].id;chapterId='';saveNow();go('desk');},
 'add-demo':()=>{const p=demoProject();state.projects.push(p);state.activeId=p.id;chapterId=p.chapters[2].id;saveNow();go('desk');toast('サンプルを別作品として追加しました。元の作品は残っています。');}
};
function deleteRecord(key,id,label){if(!ask(label+'を削除します。よろしいですか？'))return;project()[key]=project()[key].filter(x=>x.id!==id);closeModal();saveNow();render();}
function formData(form){return Object.fromEntries(new FormData(form).entries());}
function updateRecord(key,id,record){const p=project();if(id){const index=p[key].findIndex(x=>x.id===id);if(index===-1)throw Error('編集対象が見つかりません。');p[key][index]={...p[key][index],...record};}else p[key].push({id:uid(),...record});}
function submitForm(form){const d=formData(form),id=form.dataset.id||'',p=project();
 if(form.id==='project-form'){if(!d.title.trim())return toast('作品名を入力してください。');const fields={title:d.title.trim(),genre:d.genre,brief:d.brief,voice:d.voice,invariants:d.invariants,notes:d.notes};if(form.dataset.new==='true'){const q=newProject(fields.title);Object.assign(q,fields);state.projects.push(q);state.activeId=q.id;chapterId='';}else Object.assign(p,fields);}
 else if(form.id==='fact-form'){if(!d.name.trim()||!d.attribute.trim()||!d.value.trim())return toast('名前・項目・設定内容を入力してください。');if(d.from&&d.to&&Number(d.from)>Number(d.to))return toast('適用終了を開始以後にしてください。');const old=p.facts.find(f=>f.id===id);if(old?.immutable&&old.canon==='confirmed'&&!ask('変更禁止の確定設定を編集します。既存の本文への影響も確認してください。変更しますか？'))return;updateRecord('facts',id,{category:d.category,name:d.name.trim(),attribute:d.attribute.trim(),value:d.value,from:d.from,to:d.to,sourceChapterId:d.sourceChapterId,sourceQuote:d.sourceQuote,notes:d.notes,canon:d.canon,immutable:d.immutable==='on',watchWords:d.watchWords});}
 else if(form.id==='event-form'){if(!d.title.trim())return toast('出来事の名前を入力してください。');if(d.end&&!d.start)return toast('終了時刻だけでなく開始時刻も入力してください。');if(d.start&&d.end&&d.start>d.end)return toast('終了時刻は開始以後にしてください。日をまたぐ場合は2件に分けます。');updateRecord('events',id,{title:d.title.trim(),day:d.day,start:d.start,end:d.end,actor:d.actor.trim(),place:d.place.trim(),chapterId:d.chapterId,description:d.description,canon:d.canon});}
 else if(form.id==='hook-form'){if(!d.title.trim())return toast('伏線の名前を入力してください。');updateRecord('hooks',id,{title:d.title.trim(),description:d.description,plantedId:d.plantedId,payoffId:d.payoffId,state:d.state,notes:d.notes});}
 else if(form.id==='issue-form'){if(!d.title.trim())return toast('確認したいことを入力してください。');updateRecord('issues',id,{title:d.title.trim(),kind:d.kind,chapterId:d.chapterId,evidence:d.evidence,proposal:d.proposal,notes:d.notes,state:d.state,createdAt:p.issues.find(i=>i.id===id)?.createdAt||now()});}
 else if(form.id==='rule-form'){if(!d.note.trim())return toast('意図を入力してください。');p.ruleReviews[id]={state:'intentional',note:d.note};}
 else if(form.id==='chapter-meta-form'){const c=chapter(chapterId);if(!c||c.status!=='draft')return;const n=Number(d.number);if(!Number.isInteger(n)||n<1||n>100000)return toast('話数は1〜100000の整数にしてください。');if(p.chapters.some(x=>x.id!==c.id&&x.number===n))return toast('同じ話数が既にあります。別の話数を指定してください。');snapshot(c,'話数・タイトル変更前');c.number=n;c.title=d.title;c.updatedAt=now();}
 else if(form.id==='reply-form'){if(!d.text.trim())return toast('本文を入力してください。');const a=p.assistant,target=chapter(a.targetId);let c;if(d.destination==='target'){if(!target||target.status!=='draft')return toast('元の原稿は固定されています。新しい下書きとして保存してください。');if(target.text.trim()&&!ask('選択中の下書きを置き換えます。今の本文は履歴に残します。よろしいですか？'))return;snapshot(target,'ChatGPTの回答を取り込む前');c=target;}else{c=newChapter(Math.max(0,...p.chapters.map(c=>c.number))+1);c.title=d.title||'ChatGPTと作った下書き';p.chapters.push(c);}c.text=d.text;c.updatedAt=now();c.status='draft';chapterId=c.id;a.targetId=c.id;closeModal();saveNow();go('writer');toast('下書きとして取り込みました。まだ採用・設定の確定はしていません。');return;}
 else return;
 closeModal();saveNow();render();toast(dirty?'画面に反映しました。端末への保存状態を確認してください。':'保存しました。');
}
// Delegation keeps all inputs responsive without destroying caret position or IME composition.
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const fn=actions[el.dataset.action];if(fn){try{const result=fn(el);if(result?.catch)result.catch(err=>{console.error(err);toast('操作を完了できませんでした。入力をバックアップしてください。');});}catch(err){console.error(err);toast('操作を完了できませんでした。入力をバックアップしてください。');}}});
document.addEventListener('submit',e=>{if(!e.target.matches('#modal form'))return;e.preventDefault();if(!e.target.reportValidity())return;try{submitForm(e.target);}catch(err){console.error(err);toast('保存処理を完了できませんでした。\n'+err.message);}});
document.addEventListener('input',e=>{
 const el=e.target;
 if(el.dataset.chapterField){const c=chapter(chapterId),key=el.dataset.chapterField;if(!c||c.status!=='draft'&&key!=='intent')return;c[key]=el.value;c.updatedAt=now();if(key==='text'&&$('#word-count'))$('#word-count').textContent=fmt(chars(c.text))+'字 / 空白・改行を除く';markDirty();}
 if(el.dataset.aiField&&!['SELECT'].includes(el.tagName)&&el.type!=='checkbox'){const a=project().assistant,key=el.dataset.aiField;a[key]=key==='wordCount'?Math.max(200,Math.min(20000,Number(el.value)||2000)):el.value;markDirty();if(key!=='reply')paintPrompt();}
 if(el.dataset.autoField){const a=project().auto,key=el.dataset.autoField;if(key==='targetTotal')a[key]=Math.max(1,Math.min(1000,Number(el.value)||100));else if(key==='wordCount')a[key]=Math.max(200,Math.min(20000,Number(el.value)||2000));else a[key]=el.value;markDirty();}
 if(el.id==='fact-search'){factSearch=el.value;const fs=project().facts.filter(f=>(filterCategory==='すべて'||f.category===filterCategory)&&(filterCanon==='all'||f.canon===filterCanon)&&(!factSearch||norm([f.name,f.attribute,f.value,f.notes].join(' ')).includes(norm(factSearch))));$('#facts-list').innerHTML=factCards(fs);$('#facts-count').textContent=fs.length+'件の設定';}
});
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.id==='project-selector'){persist();state.activeId=el.value;chapterId='';filterCategory='すべて';filterCanon='all';factSearch='';markDirty();go('desk');}
 if(el.id==='canon-filter'){filterCanon=el.value;render();}
 if(el.dataset.aiField&&(el.tagName==='SELECT'||el.type==='checkbox')){const a=project().assistant;a[el.dataset.aiField]=el.type==='checkbox'?el.checked:el.value;markDirty();if(el.dataset.aiField==='includeSummaries')paintPrompt();else render();}
 if(el.dataset.scopeId){const a=project().assistant,id=el.dataset.scopeId;a.selectedIds=el.checked?[...new Set([...a.selectedIds,id])]:a.selectedIds.filter(x=>x!==id);markDirty();render();}
 if(el.id==='packet-index')packetIndex=Number(el.value);
 if(el.id==='json-file')readJSON(el.files[0]);
 if(el.id==='text-files')readTexts(Array.from(el.files));
});
$('#overlay').addEventListener('click',()=>{$('#sidebar').classList.remove('open');$('#overlay').classList.remove('show');});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal();}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();dirty=true;if(persist())toast('端末内へ保存しました。大切な原稿はJSONでも書き出してください。');}if(e.key==='Escape'){document.body.classList.remove('focus-mode');$('#sidebar').classList.remove('open');$('#overlay').classList.remove('show');}});
window.addEventListener('storage',e=>{if(e.key===STORAGE_KEY&&e.newValue!==lastRaw){saveBlock='conflict';clearTimeout(saveTimer);clearTimeout(retryTimer);paintSave();paintNotices();}});
window.addEventListener('pagehide',()=>{if(dirty)persist(true);});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&dirty)persist(true);});
window.addEventListener('beforeunload',e=>{if(dirty&&!persist(true)){e.preventDefault();e.returnValue='';}});
load();render();
</script>
</body>
</html>
